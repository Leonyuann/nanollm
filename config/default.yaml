bpe:
  num_process: 8
  vocab_size: 10000
  special_tokens: ["<|endoftext|>"]
  vocab_path: "outputs/artifacts/vocab.txt"
  merge_path: "outputs/artifacts/merges.txt"

data:
  owt_train_path: "/xts001/data/owt_train.txt"
  owt_valid_path: "/xts001/data/owt_valid.txt"
  TinyStories_train_path: "/xts001/data/TinyStoriesV2-GPT4-train.txt"
  TinyStories_valid_path: "/xts001/data/TinyStoriesV2-GPT4-valid.txt"
  training_data_path: "/xts001/data/training_data"
  evaluation_data_path: "/xts001/data/evaluation_data"

transformer:
  RMSNorm_eps: 0.00001

adamw:
  lr: 0.001
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.01
  eps: 0.00000001

model:
  vocab_size: 10000
  context_length: 2048
  num_layers: 12
  d_model: 512
  num_heads: 8
  d_ff: 1344
  rope_theta: 10
  device: cuda
  dtype: null

training:
  training_step: 12000
  eval_every: 500
  save_every: 500
  save_dir: "/xts001/checkpoints"
  batch_size: 4
  use_wandb: true
