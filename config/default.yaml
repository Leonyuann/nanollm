bpe:
  num_process: 4
  vocab_size: 10000
  special_tokens: ["<|endoftext|>"]
  vocab_path: "outputs/artifacts/vocab.txt"
  merge_path: "outputs/artifacts/merges.txt"

data:
  owt_train_path: "data/owt_train.txt"
  owt_valid_path: "data/owt_valid.txt"
  TinyStories_train_path: "data/TinyStoriesV2-GPT4-train.txt"
  TinyStories_valid_path: "data/TinyStoriesV2-GPT4-valid.txt"

model:
  vocab_size: 10000
  max_seq_len: 256
  d_model: 512
  num_layers: 10
  num_heads: 8
  ffn_hidden_dim: 2048
  norm_type: "rmsnorm"
  ffn_type: "swiglu"
  use_residual: true
  dropout: 0.0
  tie_embeddings: true
  rope_base: 10000.0
  bias: true

training:
  dataset: "tinystories"
  batch_size: 8
  max_steps: 1000
  learning_rate: 3.0e-4
  warmup_steps: 100
  log_interval: 10
  eval_interval: 100
  eval_steps: 20
  device: "auto"
  seed: 42
