[project]
name = "nanollm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.3.1",
    "einops>=0.8.2",
    "jaxtyping>=0.3.9",
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "psutil>=7.2.2",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "regex>=2026.4.4",
    "tiktoken>=0.12.0",
    "torch==2.11.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
